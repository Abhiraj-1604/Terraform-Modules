name: Digger

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  digger:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write        # required for OIDC token exchange with Azure
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Digger
        uses: diggerhq/digger@v0.6.64
        with:
          digger-token:          ${{ secrets.DIGGER_TOKEN }}
          setup-azure:           true
          azure-client-id:       ${{ secrets.ARM_CLIENT_ID }}
          azure-tenant-id:       ${{ secrets.ARM_TENANT_ID }}
          azure-subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          setup-terraform:       true
          terraform-version:     "1.9.0"
        env:
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          GITHUB_CONTEXT: ${{ toJson(github) }}
