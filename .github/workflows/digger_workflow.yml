name: Digger Workflow

on:
  workflow_dispatch:
    inputs:
      digger-spec:
        description: "Digger job spec (injected by Digger GitHub App)"
        required: true

  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened]

  issue_comment:
    types: [created]

jobs:
  digger:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write        # required for OIDC token exchange with Azure
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Digger
        uses: diggerhq/digger@v0.6.64
        with:
          no-backend:            true
          setup-azure:           true
          azure-client-id:       ${{ secrets.ARM_CLIENT_ID }}
          azure-tenant-id:       ${{ secrets.ARM_TENANT_ID }}
          azure-subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          setup-terraform:       true
          terraform-version:     "1.9.0"
        env:
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          GITHUB_CONTEXT: ${{ toJson(github) }}
