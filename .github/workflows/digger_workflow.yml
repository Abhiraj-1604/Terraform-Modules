name: Digger Workflow

on:
  # Digger orchestrator callback – triggered by the Digger GitHub App
  workflow_dispatch:
    inputs:
      digger-spec:
        description: "Digger job spec (injected by Digger GitHub App)"
        required: true

  # Run init + plan on every push to dev
  push:
    branches:
      - dev

  # Run init + plan on every PR targeting main
  pull_request:
    branches:
      - main

jobs:
  # ── Digger orchestrator callback (workflow_dispatch only) ──────────────────
  digger:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write        # required for OIDC token exchange with Azure
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Digger
        uses: diggerhq/digger@v0.6.64
        with:
          digger-spec:           ${{ inputs.digger-spec }}
          digger-token:          ${{ secrets.DIGGER_TOKEN }}
          setup-azure:           true
          azure-client-id:       ${{ secrets.ARM_CLIENT_ID }}
          azure-tenant-id:       ${{ secrets.ARM_TENANT_ID }}
          azure-subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          setup-terraform:       true
          terraform-version:     "1.9.0"
        env:
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          GITHUB_CONTEXT: ${{ toJson(github) }}

  # ── Auto init + plan (push to dev / PR to main) ───────────────────────────
  digger-plan:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write        # required for OIDC token exchange with Azure
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Digger (init + plan)
        uses: diggerhq/digger@v0.6.64
        with:
          digger-token:          ${{ secrets.DIGGER_TOKEN }}
          setup-azure:           true
          azure-client-id:       ${{ secrets.ARM_CLIENT_ID }}
          azure-tenant-id:       ${{ secrets.ARM_TENANT_ID }}
          azure-subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          setup-terraform:       true
          terraform-version:     "1.9.0"
          # Restrict to plan-only; apply is not triggered here
          disable-apply-changes: true
        env:
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          GITHUB_CONTEXT: ${{ toJson(github) }}
