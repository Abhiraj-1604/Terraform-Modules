projects:
  - name: azure-infra
    dir: .
    workspace: dev
    terragrunt: false
    workflow: default

workflows:
  default:
    plan:
      steps:
        - init:
            extra_args: ["-backend-config=backend.hcl"]
        - plan:
            extra_args: ["-var-file=terraform.tfvars"]
    apply:
      steps:
        - init:
            extra_args: ["-backend-config=backend.hcl"]
        - apply:
            extra_args: ["-var-file=terraform.tfvars"]
