telemetry: false
pr_locks: false

projects:
  - name: azure-infra
    dir: .
    workspace: dev
    terragrunt: false
    workflow: default

workflows:
  default:
    workflow_configuration:
      on_pull_request_pushed: [digger plan]
      on_pull_request_closed: [digger unlock]
      on_commit_to_default: [digger plan]
    plan:
      steps:
        - init:
            extra_args: ["-backend-config=backend.hcl"]
        - plan:
            extra_args: ["-var-file=terraform.tfvars"]
